name: Ratio Backend CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build All Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: cd api-gateway && mvn clean package -DskipTests
      - run: cd prompt-management && mvn clean package -DskipTests
      - run: cd execution-engine && mvn clean package -DskipTests
      - run: cd cost-tracker && mvn clean package -DskipTests
      - run: cd auth-service && mvn clean package -DskipTests